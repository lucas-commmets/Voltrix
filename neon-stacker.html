<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower Rush</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#0a0c14">
<link rel="stylesheet" href="style.css">
<style> :root { --accent: #ff9a4d; --accent-dim: rgba(255,154,77,0.25); } </style>
</head>
<body>
  <h1>Tower <span>Rush</span></h1>
  <a class="backlink" href="index.html">&larr; Voltrix</a>

  <div id="panel">
    <div class="stat"><div class="label">Height</div><div class="value" id="scoreVal">0</div></div>
    <div class="stat best"><div class="label">Best</div><div class="value" id="bestVal">0</div></div>
  </div>

  <div id="wrap">
    <canvas id="game" width="420" height="560"></canvas>
    <div id="overlay">
      <div class="card">
        <h2 id="cardTitle">Ready</h2>
        <p>Tap when the moving block lines up with the one below it. Miss the overlap and it's over.</p>
        <button class="go" id="goBtn">Start</button>
      </div>
    </div>
  </div>
  <div id="controls">tap / click / space to drop the block</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const goBtn = document.getElementById('goBtn');
const scoreVal = document.getElementById('scoreVal');
const bestVal = document.getElementById('bestVal');

let audioCtx = null;
function tone(freq, dur, type='sine', vol=0.1) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const BLOCK_H = 32;
const COLORS = ['#ff9a4d','#ffd166','#5cd97a','#4dd6ff','#b784ff','#ff7ab8'];

let stack, current, score, best = 0, camY, state = 'idle', particles = [], shakeT = 0;

function reset() {
  stack = [{ x: W/2 - 80, w: 160, y: H - BLOCK_H, color: COLORS[0] }];
  score = 0;
  camY = 0;
  particles = [];
  spawnNext();
}

function spawnNext() {
  const last = stack[stack.length-1];
  const dir = Math.random() < 0.5 ? -1 : 1;
  const speed = 2.6 + score * 0.09;
  current = {
    x: dir>0 ? -last.w : W,
    w: last.w,
    y: last.y - BLOCK_H,
    vx: speed * dir,
    color: COLORS[stack.length % COLORS.length]
  };
}

function updateHud() { scoreVal.textContent = score; bestVal.textContent = best; }

function drop() {
  if (state !== 'play') return;
  const last = stack[stack.length-1];
  const overlapStart = Math.max(current.x, last.x);
  const overlapEnd = Math.min(current.x+current.w, last.x+last.w);
  const overlapW = overlapEnd - overlapStart;

  if (overlapW <= 4) {
    endGame();
    return;
  }

  const perfect = Math.abs(overlapW - current.w) < 4 && Math.abs(overlapW - last.w) < 4;
  const placed = { x: overlapStart, w: overlapW, y: current.y, color: current.color };
  stack.push(placed);
  score++;
  updateHud();

  // falling chunk particle for the cut-off piece
  if (!perfect) {
    const cutLeft = current.x < overlapStart;
    const cutX = cutLeft ? current.x : overlapEnd;
    const cutW = cutLeft ? (overlapStart-current.x) : (current.x+current.w-overlapEnd);
    if (cutW > 1) {
      for (let i=0;i<6;i++) {
        particles.push({
          x: cutX + Math.random()*cutW, y: current.y+BLOCK_H/2,
          vx: (Math.random()-0.5)*1.5, vy: -1-Math.random()*2,
          grav: true, life: 40, color: current.color
        });
      }
    }
  } else {
    shakeT = 4;
    for (let i=0;i<10;i++) {
      const a = Math.random()*Math.PI*2;
      particles.push({ x: placed.x+placed.w/2, y: placed.y+BLOCK_H/2, vx:Math.cos(a)*2, vy:Math.sin(a)*2, life:22, color:'#fff' });
    }
  }

  tone(400+score*10, 0.1, perfect?'triangle':'square', 0.09);
  spawnNext();
}

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); drop(); }
});
canvas.addEventListener('mousedown', drop);
canvas.addEventListener('touchstart', e => { e.preventDefault(); drop(); }, {passive:false});

function endGame() {
  state = 'over';
  if (score > best) best = score;
  updateHud();
  shakeT = 12;
  tone(140,0.4,'sawtooth',0.14);
  cardTitle.textContent = 'Toppled';
  document.querySelector('.card p').innerHTML = `Height: <b style="color:#ff9a4d">${score}</b>`;
  goBtn.textContent = 'Try again';
  overlay.classList.remove('hidden');
}

function startGame() {
  reset();
  state = 'play';
  overlay.classList.add('hidden');
}
goBtn.addEventListener('click', startGame);

function update() {
  if (state === 'play' && current) {
    current.x += current.vx;
    // Only bounce if moving further outwards past the edge
    if ((current.x < -current.w * 0.3 && current.vx < 0) || 
        (current.x > W - current.w * 0.7 && current.vx > 0)) {
      current.vx *= -1;
    }
  }
  const targetCam = Math.max(0, (H - (stack.length) * BLOCK_H - 220));
  camY += (targetCam - camY) * 0.15;
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.grav) p.vy += 0.15;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  if (shakeT > 0) shakeT *= 0.8;
}

function draw() {
  ctx.save();
  if (shakeT > 0.3) ctx.translate((Math.random()-0.5)*shakeT, (Math.random()-0.5)*shakeT);

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#151a28'); g.addColorStop(1,'#0a0c14');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(0, camY);

  for (const b of stack) {
    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, BLOCK_H-2);
    ctx.restore();
  }

  if (current && state === 'play') {
    ctx.save();
    ctx.shadowColor = current.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = current.color;
    ctx.fillRect(current.x, current.y, current.w, BLOCK_H-2);
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life/40);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
  ctx.restore();
}

reset();
draw();
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
