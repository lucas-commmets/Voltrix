<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flash Target</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#0a0c14">
<link rel="stylesheet" href="style.css">
<style> :root { --accent: #ffd166; --accent-dim: rgba(255,209,102,0.25); } </style>
</head>
<body>
  <h1>Flash <span>Target</span></h1>
  <a class="backlink" href="index.html">&larr; Voltrix</a>

  <div id="panel">
    <div class="stat"><div class="label">Score</div><div class="value" id="scoreVal">0</div></div>
    <div class="stat best"><div class="label">Best</div><div class="value" id="bestVal">0</div></div>
    <div class="stat lives"><div class="label">Lives</div><div class="value" id="livesVal">♥♥♥</div></div>
  </div>

  <div id="wrap">
    <canvas id="game" width="500" height="440"></canvas>
    <div id="overlay">
      <div class="card">
        <h2 id="cardTitle">Ready</h2>
        <p>Click the target before the ring closes. It shrinks and speeds up as you go. 3 misses ends it.</p>
        <button class="go" id="goBtn">Start</button>
      </div>
    </div>
  </div>
  <div id="controls">click precisely and fast &nbsp;·&nbsp; targets get smaller as your score climbs</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const goBtn = document.getElementById('goBtn');
const scoreVal = document.getElementById('scoreVal');
const bestVal = document.getElementById('bestVal');
const livesVal = document.getElementById('livesVal');

let audioCtx = null;
function tone(freq, dur, type='sine', vol=0.1) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

let score, best = 0, lives, state = 'idle', target, particles, shakeT = 0;

function fmtHearts(n) { return '♥'.repeat(Math.max(n,0)) || '–'; }

function reset() {
  score = 0; lives = 3;
  particles = [];
  updateHud();
}
function updateHud() { scoreVal.textContent = score; bestVal.textContent = best; livesVal.textContent = fmtHearts(lives); }

function radiusFor(s) { return Math.max(14, 42 - s*1.1); }
function limitFor(s) { return Math.max(650, 1600 - s*45); }

function spawnTarget() {
  const r = radiusFor(score);
  const x = r + 20 + Math.random()*(W - 2*(r+20));
  const y = r + 20 + Math.random()*(H - 2*(r+20));
  target = { x, y, r, startT: performance.now(), limit: limitFor(score) };
}

function startGame() {
  reset();
  state = 'play';
  overlay.classList.add('hidden');
  spawnTarget();
}
goBtn.addEventListener('click', startGame);

function hit() {
  score++;
  updateHud();
  tone(760+Math.min(score,25)*14, 0.09, 'triangle', 0.1);
  for (let i=0;i<12;i++) {
    const a = Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:target.x,y:target.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:22});
  }
  spawnTarget();
}

function miss() {
  lives--;
  updateHud();
  shakeT = 8;
  tone(200,0.15,'sawtooth',0.08);
  if (lives <= 0) endGame();
  else spawnTarget();
}

function endGame() {
  state = 'over';
  if (score > best) best = score;
  updateHud();
  shakeT = 14;
  tone(140,0.35,'sawtooth',0.13);
  cardTitle.textContent = 'Out of lives';
  document.querySelector('.card p').innerHTML = `Score: <b style="color:#ffd166">${score}</b>`;
  goBtn.textContent = 'Try again';
  overlay.classList.remove('hidden');
}

function handleClick(mx,my) {
  if (state !== 'play' || !target) return;
  const dist = Math.hypot(mx-target.x, my-target.y);
  if (dist <= target.r) hit(); else miss();
}
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  handleClick((e.clientX-rect.left)*(W/rect.width), (e.clientY-rect.top)*(H/rect.height));
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  handleClick((t.clientX-rect.left)*(W/rect.width), (t.clientY-rect.top)*(H/rect.height));
}, {passive:false});

function update() {
  if (state === 'play' && target) {
    const elapsed = performance.now() - target.startT;
    if (elapsed > target.limit) miss();
  }
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life--; }
  particles = particles.filter(p=>p.life>0);
  if (shakeT > 0) shakeT *= 0.8;
}

function draw() {
  ctx.save();
  if (shakeT > 0.3) ctx.translate((Math.random()-0.5)*shakeT, (Math.random()-0.5)*shakeT);

  ctx.fillStyle = '#0a0c14';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  for (let x=0;x<W;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (target && state === 'play') {
    const elapsed = performance.now() - target.startT;
    const frac = Math.max(0, 1 - elapsed/target.limit);

    const glow = ctx.createRadialGradient(target.x,target.y,0,target.x,target.y,target.r*2.2);
    glow.addColorStop(0,'rgba(255,209,102,0.4)');
    glow.addColorStop(1,'rgba(255,209,102,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(target.x,target.y,target.r*2.2,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(target.x,target.y,target.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#05060a';
    ctx.beginPath(); ctx.arc(target.x,target.y,target.r*0.32,0,Math.PI*2); ctx.fill();

    // closing timer ring
    ctx.strokeStyle = frac < 0.3 ? '#ff5a5a' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(target.x,target.y,target.r+8,-Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
    ctx.stroke();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life/22);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
